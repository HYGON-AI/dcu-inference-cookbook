<svg xmlns="http://www.w3.org/2000/svg" width="1907" height="434" viewBox="0 0 1907 434" role="img" aria-labelledby="title desc">
  <title id="title">inference-cookbook-das</title>
  <desc id="desc">Blue, green and orange handwritten-style logo for inference-cookbook-das with an AI chip symbol.</desc>

  <rect width="1907" height="434" fill="#ffffff"/>

  <defs>
    <filter id="roughen" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.12" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="chipFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f7ff"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn accent marks -->
  <g fill="none" stroke-linecap="round" filter="url(#roughen)">
    <path d="M210 116 L187 75" stroke="#296ad9" stroke-width="8"/>
    <path d="M183 137 L149 123" stroke="#296ad9" stroke-width="8"/>
    <path d="M234 104 L236 80" stroke="#296ad9" stroke-width="7"/>
  </g>

  <!-- Main wordmark -->
  <g font-family="'Segoe Print','Comic Sans MS',cursive" font-style="italic" font-weight="700" dominant-baseline="middle" filter="url(#roughen)">
    <text x="240" y="226" font-size="132" letter-spacing="-8" fill="#252324">inference</text>
    <text x="800" y="226" font-size="132" letter-spacing="-9" fill="#296ad9">-cookbook</text>
    <text x="1418" y="226" font-size="132" letter-spacing="-7" fill="#252324">-</text>
    <text x="1490" y="226" font-size="132" letter-spacing="-7" fill="#6fba2c">d</text>
    <text x="1576" y="226" font-size="132" letter-spacing="-7" fill="#296ad9">a</text>
    <text x="1656" y="226" font-size="132" letter-spacing="-7" fill="#ff7a16">s</text>
  </g>

  <!-- Brush underline -->
  <g fill="none" stroke="#296ad9" stroke-linecap="round" filter="url(#roughen)">
    <path d="M790 326 C955 293, 1145 294, 1360 324" stroke-width="8"/>
    <path d="M794 334 C969 307, 1168 309, 1357 330" stroke-width="3" opacity=".88"/>
  </g>

  <!-- AI chip -->
  <g transform="translate(1690 36) rotate(8 82 82) scale(.62)" stroke-linecap="round" stroke-linejoin="round" filter="url(#roughen)">
    <rect x="25" y="30" width="118" height="118" rx="17" fill="url(#chipFill)" stroke="#296ad9" stroke-width="7"/>
    <g stroke="#296ad9" stroke-width="6">
      <path d="M42 30 V12 M69 30 V8 M98 30 V10 M126 30 V14"/>
      <path d="M42 148 V166 M69 148 V171 M98 148 V169 M126 148 V165"/>
      <path d="M25 48 H7 M25 75 H3 M25 103 H6 M25 130 H10"/>
      <path d="M143 48 H161 M143 75 H166 M143 103 H163 M143 130 H159"/>
    </g>
    <text x="48" y="112" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="56" font-style="italic" fill="#6fba2c">AI</text>
  </g>

  <!-- Green activity sparks -->
  <g fill="none" stroke="#6fba2c" stroke-width="8" stroke-linecap="round" filter="url(#roughen)">
    <path d="M1687 103 L1662 74"/>
    <path d="M1675 124 L1642 111"/>
  </g>
</svg>
